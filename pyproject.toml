[project]
name = "krea2-pixel-art-refiner"
version = "2.6.1"
description = "Refine Krea 2 and MiniMax H3 output with automatic or controlled pixel-grid collapse and perceptual palette reduction."
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.8"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/envy-ai/ComfyUI-Krea2-Pixel-Art-Refiner"
Documentation = "https://github.com/envy-ai/ComfyUI-Krea2-Pixel-Art-Refiner#readme"
"Bug Tracker" = "https://github.com/envy-ai/ComfyUI-Krea2-Pixel-Art-Refiner/issues"

[tool.comfy]
PublisherId = "envy-ai"
DisplayName = "Krea 2 and MiniMax H3 Pixel Art Refiners"
